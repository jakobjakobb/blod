<!DOCTYPE html>
<html class="locked">
<head>
    <style>
        html {
            scrollbar-width: none;
            -ms-overflow-style: none;
            overflow-y: scroll;
            overflow-x: hidden;
        }


        html.locked,
        body.locked {
            overflow: hidden !important;
            height: 100vh !important;
            touch-action: none;
        }

        html::-webkit-scrollbar,
        body::-webkit-scrollbar {
            display: none;
        }

        body {
            margin: 0;
            padding: 0;
            overflow-y: scroll;
            overflow-x: hidden;
            width: 100%;
            background-color: #000;
        }

        #audio-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }

        #audio-overlay.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .overlay-text {
            color: #ffffff;
            font-family: 'Trebuchet MS', sans-serif;
            font-size: 1.5rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            text-align: center;
            padding: 20px 40px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            background: rgba(0, 0, 0, 0.5);
            border-radius: 4px;
            user-select: none;
        }

        .site-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .site-bg img {
            width: 100%;
            height: auto;
            display: block;
        }

        section {
            position: relative;
            width: 100%;
            height: 595.73vw;
        }

        section:before {
            content: "";
            position: absolute;
            top: 55.75vw;                    
            left: 0;
            width: 100%;
            height: calc(100% - 55.75vw);
            background-image: url(images/rain.png);
            background-repeat: repeat;
            background-size: 300px 300px;
            animation: rain 20s linear infinite;
            opacity: 0.25;
            z-index: 2;
        }

        @keyframes rain {
            0% {
                background-position: 0 0;
            }
            100% {
                background-position: 300px 3000px;
            }
        }
    </style>
</head>

<body class="locked">
    <div id="audio-overlay">
        <div class="overlay-text">Tryk for at aktivere lyd</div>
    </div>

    <div class="site-bg">
        <img src="images/site.png" alt="Site Background">
    </div>

    <section></section>

<script>
    const audioTracks = [
        {
            id: 'storm',
            src: 'audio/storm.mp3',
            startPercent: 0,
            endPercent: 76,
            maxVolume: 0.1,
            fadeMargin: 5
        },
        {
            id: 'ambient-night',
            src: 'audio/ambient-night.mp3',
            startPercent: 0,
            endPercent: 77,
            maxVolume: 0.1,
            fadeMargin: 5
        },
        {
            id: 'big-fire',
            src: 'audio/big-fire.mp3',
            startPercent: 50,
            endPercent: 75,
            maxVolume: 1.0,
            fadeMargin: 5
        },
        {
            id: 'church-organ',
            src: 'audio/church-organ.mp3',
            startPercent: 20,
            endPercent: 35,
            maxVolume: 1.0,
            fadeMargin: 3
        },
        {
            id: 'heavy-wind',
            src: 'audio/heavy-wind.mp3',
            startPercent: 30,
            endPercent: 70,
            maxVolume: 1.0,
            fadeMargin: 5
        },
        {
            id: 'horror-atmosphere',
            src: 'audio/horror-atmosphere.mp3',
            startPercent: 30,
            endPercent: 73,
            maxVolume: 0.2,
            fadeMargin: 5
        },
        {
            id: 'waterfall',
            src: 'audio/waterfall.mp3',
            startPercent: 75,
            endPercent: 98,
            maxVolume: 1.0,
            fadeMargin: 5
        }
    ];

    const players = audioTracks.map(track => {
        const audio = new Audio(track.src);
        audio.loop = true;
        audio.volume = 0;
        return {
            ...track,
            audioElement: audio,
            isPlaying: false
        };
    });

    let isAudioInitialized = false;


    function updateAudioOnScroll() {
        if (!isAudioInitialized) return;

        const scrollTop = window.scrollY || document.documentElement.scrollTop;
        const maxScroll = document.documentElement.scrollHeight - window.innerHeight;
        if (maxScroll <= 0) return;

        const scrollPercent = (scrollTop / maxScroll) * 100;

        players.forEach(track => {
            const { startPercent, endPercent, fadeMargin, maxVolume, audioElement } = track;

            if (scrollPercent >= startPercent && scrollPercent <= endPercent) {
                
                if (!track.isPlaying) {
                    audioElement.play().then(() => {
                        track.isPlaying = true;
                    }).catch(err => console.log(`Fejl ved afspilning af ${track.id}:`, err));
                }

                let factor = 1;

                if (scrollPercent < startPercent + fadeMargin) {
                    factor = (scrollPercent - startPercent) / fadeMargin;
                } 

                else if (scrollPercent > endPercent - fadeMargin) {
                    factor = (endPercent - scrollPercent) / fadeMargin;
                }

                factor = Math.max(0, Math.min(1, factor));
                audioElement.volume = factor * maxVolume;

            } else {
                audioElement.volume = 0;
                if (track.isPlaying) {
                    audioElement.pause();
                    track.isPlaying = false;
                }
            }
        });
    }

    window.addEventListener('scroll', updateAudioOnScroll);

    const overlay = document.getElementById('audio-overlay');

    overlay.addEventListener('click', () => {
        overlay.classList.add('hidden');
        
        document.documentElement.classList.remove('locked');
        document.body.classList.remove('locked');

        if (!isAudioInitialized) {
            isAudioInitialized = true;
            updateAudioOnScroll();
        }
    });
</script>
</body>
</html>
